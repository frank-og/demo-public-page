<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ShotDepth Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap">
<style>
/* Layout: light editorial magazine. White paper, large photography, serif headlines, court-blue accent from the logo, ball-yellow used only as a marker. Single light theme by choice. */
:root{
  color-scheme:light;
  --paper:#FFFFFF; --wash:#F3F5F8; --ink:#101317; --ink2:#2E333B; --muted:#69717E; --line:#E3E6EB;
  --accent:#1F45B5; --accent2:#163690; --felt:#D7EA3C; --on-dark:#FFFFFF;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Archivo",system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --gut:clamp(16px,4vw,48px); --maxw:1240px;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.6;padding-inline:0;padding-block:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:calc(var(--maxw) + 2*var(--gut));margin-inline:auto;padding-inline:var(--gut)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--serif);font-weight:500;text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.kicker{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.kicker.dot::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--felt);box-shadow:0 0 0 1px var(--ink) inset;margin-right:8px;vertical-align:1px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--sans);font-size:13px;color:var(--muted)}
.meta span+span::before{content:"·";margin-right:14px;color:var(--line)}
.ph{position:relative;overflow:hidden;background:var(--wash)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
a:hover .ph img{transform:scale(1.035)}
.credit{font-family:var(--sans);font-size:11.5px;color:var(--muted);margin-top:8px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:36px;height:24px;flex:none}
.brand b{font-family:var(--sans);font-weight:900;font-stretch:125%;font-size:19px;letter-spacing:-.01em}
.nav{display:flex;gap:26px;align-items:center;font-family:var(--sans);font-size:14.5px;font-weight:600}
.nav a{position:relative;padding-block:6px;color:var(--ink2)}
.nav a[aria-current="page"],.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--accent)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--felt);color:var(--ink);font-family:var(--mono);font-size:11.5px;font-weight:500;vertical-align:1px}
.lang{display:flex;gap:2px;font-family:var(--sans);font-size:12.5px;font-weight:700}
.lang button{border:0;background:none;color:var(--muted);padding:6px 8px;cursor:pointer;border-radius:6px}
.lang button[aria-pressed="true"]{color:var(--ink);background:var(--wash)}
.secbar{border-bottom:1px solid var(--line)}
.secbar .wrap{overflow-x:auto;scrollbar-width:none}
.secbar .wrap::-webkit-scrollbar{display:none}
.secs{display:flex;gap:26px;width:max-content;font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--muted);height:46px;align-items:center}
.secs a:hover,.secs a[aria-current="page"]{color:var(--ink)}
.secs a[aria-current="page"]{font-weight:700}

/* masthead line */
.dateline{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px 0;font-family:var(--sans);font-size:12.5px;color:var(--muted);letter-spacing:.02em}

/* cover */
.cover{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,4vw,64px);align-items:center;padding-block:28px 64px}
.cover h1{font-size:clamp(38px,5.2vw,72px);line-height:1.02;font-weight:500;letter-spacing:-.025em;margin-block:16px 20px}
.cover .dek{font-size:clamp(19px,1.6vw,22px);font-style:italic;color:var(--ink2);line-height:1.45;margin:0 0 22px;max-width:34ch}
.cover .ph{aspect-ratio:4/3;border-radius:2px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--sans);font-weight:700;font-size:14.5px;padding:13px 22px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--on-dark);cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--on-dark);border-color:var(--ink)}
.btn.blue{background:var(--accent);border-color:var(--accent)}
.btn.blue:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.light{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.btn.light:hover{background:var(--felt);border-color:var(--felt)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* section heads */
.shead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:14px;margin-bottom:28px}
.shead h2{font-size:clamp(26px,2.6vw,34px);font-weight:500}
.shead a{font-family:var(--sans);font-size:13.5px;font-weight:700;color:var(--accent)}

/* story grid */
.latest{padding-block:8px 72px}
.lead-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:40px;padding-bottom:40px;border-bottom:1px solid var(--line);margin-bottom:40px}
.story{display:grid;align-content:start;gap:10px}
.story .ph{aspect-ratio:3/2}
.story h3{font-size:22px;line-height:1.18;font-weight:600}
.story:hover h3{color:var(--accent)}
.story p{margin:0;color:var(--ink2);font-size:16.5px;line-height:1.5}
.story.lead .ph{aspect-ratio:16/10}
.story.lead h3{font-size:clamp(28px,2.8vw,38px);font-weight:500;line-height:1.08;letter-spacing:-.02em}
.story.lead p{font-size:19px;font-style:italic}
.stack{display:grid;gap:32px;align-content:start}
.stack .story .ph{aspect-ratio:16/10}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:44px 36px}

/* lab band */
.band{background:var(--wash);padding-block:72px}
.lab{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(28px,4vw,64px);align-items:center}
.lab h2{font-size:clamp(30px,3.4vw,46px);line-height:1.05;letter-spacing:-.02em;margin-block:14px 16px}
.lab p{color:var(--ink2);margin:0 0 18px;max-width:42ch}
.labcard{background:var(--paper);border-radius:6px;padding:clamp(16px,2.4vw,28px);box-shadow:0 1px 0 var(--line),0 20px 40px -24px rgba(16,19,23,.25);min-width:0}
.labcard svg{width:100%;height:auto;display:block}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:16px}
.controls label{display:grid;gap:6px;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--muted)}
.controls label span.v{color:var(--ink);font-family:var(--mono);font-weight:500}
.controls input[type=range]{width:100%;accent-color:var(--accent)}
.readout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.readout div{display:grid;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.readout b{font-family:var(--mono);font-size:clamp(20px,2.2vw,28px);font-weight:500;font-variant-numeric:tabular-nums}
.readout span{font-family:var(--sans);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.note{font-family:var(--sans);font-size:12.5px;color:var(--muted)}
.note.err{color:#B3261E}

/* figures band */
.figs{padding-block:72px}
.figrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
.figrow a{display:grid;gap:10px;align-content:start;padding:4px 22px 4px 0;margin-right:22px;border-right:1px solid var(--line)}
.figrow a:last-child{border-right:0;margin-right:0}
.figrow b{font-family:var(--mono);font-weight:400;font-size:clamp(26px,2.6vw,36px);line-height:1.05;letter-spacing:-.02em;color:var(--ink);overflow-wrap:anywhere}
.figrow span{font-size:15px;line-height:1.4;color:var(--ink2)}
.figrow a:hover b{color:var(--accent)}

/* forum band */
.fband{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:0;background:var(--ink);color:var(--on-dark);border-radius:4px;overflow:hidden;margin-bottom:80px}
.fband .ph{min-height:420px;background:var(--ink)}
.fband .ph img{position:absolute;inset:0;opacity:.9}
.fband .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,19,23,0) 30%,rgba(16,19,23,.85) 100%)}
.fband .over{position:absolute;left:0;right:0;bottom:0;padding:32px;z-index:1}
.fband .over h2{font-size:clamp(34px,4vw,56px);line-height:1;letter-spacing:-.02em;color:var(--on-dark)}
.fband .over p{margin:10px 0 0;color:rgba(255,255,255,.82);max-width:40ch;font-size:17px}
.fband .kicker{color:var(--felt)}
.flist{padding:28px 32px;display:grid;align-content:start;gap:0}
.flist .row{display:grid;gap:4px;padding-block:16px;border-bottom:1px solid rgba(255,255,255,.14)}
.flist .row b{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.25}
.flist .row:hover b{color:var(--felt)}
.flist .row small{font-family:var(--sans);font-size:12px;color:rgba(255,255,255,.62)}
.flist .empty-d{color:rgba(255,255,255,.75);font-size:16px;padding-block:16px}

/* article */
.ahead{max-width:860px;margin-inline:auto;text-align:center;padding-block:56px 36px}
.ahead h1{font-size:clamp(36px,5.4vw,68px);line-height:1.03;letter-spacing:-.025em;margin-block:18px 20px}
.ahead .dek{font-size:clamp(19px,2vw,24px);font-style:italic;color:var(--ink2);line-height:1.45;margin:0 auto 22px;max-width:40ch}
.ahead .meta{justify-content:center}
.ahero .ph{aspect-ratio:21/10;max-height:640px}
.abody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,680px) minmax(0,1fr);gap:40px;padding-block:48px 24px}
.prose{grid-column:2;font-size:19.5px;line-height:1.68;color:var(--ink2)}
.prose p{margin:0 0 1.15em}
.prose h3{font-size:27px;font-weight:600;color:var(--ink);margin:1.7em 0 .5em;line-height:1.2}
.prose>p:first-child::first-letter{float:left;font-size:4.4em;line-height:.82;font-weight:500;padding:8px 10px 0 0;color:var(--ink)}
.aside{grid-column:3;align-self:start;position:sticky;top:130px;display:grid;gap:10px;max-width:240px;padding-top:6px;border-top:2px solid var(--ink)}
.aside b{font-family:var(--mono);font-weight:400;font-size:34px;line-height:1.05;letter-spacing:-.02em;overflow-wrap:anywhere}
.aside span{font-size:15px;line-height:1.45;color:var(--ink2)}
.debate{grid-column:2;margin-top:28px;border:1px solid var(--line);border-radius:6px;padding:clamp(22px,3vw,36px);display:grid;gap:16px;background:linear-gradient(180deg,var(--wash),var(--paper))}
.debate q{font-family:var(--serif);font-size:clamp(24px,2.6vw,32px);font-style:italic;font-weight:500;line-height:1.25;color:var(--ink);quotes:"“" "”"}
.debate .btn{justify-self:start}
.sources{grid-column:2;margin-top:40px;padding-top:18px;border-top:1px solid var(--line)}
.sources ol{margin:12px 0 0;padding-left:20px;display:grid;gap:8px;font-family:var(--sans);font-size:13.5px;line-height:1.5;color:var(--muted)}
.more{padding-block:56px 80px}

/* section page */
.sechead{padding-block:56px 36px;border-bottom:1px solid var(--line);margin-bottom:44px}
.sechead h1{font-size:clamp(44px,6vw,84px);line-height:1;letter-spacing:-.03em;margin-top:12px}

/* forum */
.fhero{position:relative;color:var(--on-dark);background:var(--ink);min-height:340px;display:grid;align-items:end;overflow:hidden}
.fhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.fhero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,19,23,.2),rgba(16,19,23,.85))}
.fhero .wrap{position:relative;z-index:1;width:100%;padding-block:44px;display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
.fhero h1{font-size:clamp(48px,7vw,96px);line-height:.95;letter-spacing:-.03em;color:var(--on-dark)}
.fhero p{margin:12px 0 0;max-width:52ch;color:rgba(255,255,255,.85);font-size:18px}
.fhero .kicker{color:var(--felt)}
.forum{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;padding-block:36px 80px}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:14px;font-weight:600;margin-bottom:6px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 0;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.thread{display:grid;grid-template-columns:72px minmax(0,1fr) 64px;gap:18px;align-items:center;padding-block:20px;border-bottom:1px solid var(--line)}
.thumb{width:72px;height:72px;border-radius:4px;overflow:hidden;background:var(--wash);display:grid;place-items:center;font-family:var(--serif);font-size:30px;font-weight:600;color:var(--accent)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thread h3{font-size:21px;font-weight:600;line-height:1.22;margin:4px 0}
.thread:hover h3{color:var(--accent)}
.thread .snip{margin:0;color:var(--muted);font-size:15.5px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.count{text-align:right;font-family:var(--sans)}
.count b{display:block;font-family:var(--mono);font-weight:400;font-size:26px;line-height:1}
.count span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.fside{display:grid;gap:24px;align-content:start}
.fside h3{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--line)}
.wait{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.wait .thumb{width:52px;height:52px}
.wait b{font-family:var(--serif);font-weight:600;font-size:15.5px;line-height:1.25}
.wait:hover b{color:var(--accent)}
.empty{padding:36px;border:1px dashed var(--line);border-radius:6px;color:var(--ink2);display:grid;gap:14px;justify-items:start;margin-top:20px}
.status{font-family:var(--sans);font-size:14px;color:var(--ink2);padding:14px 18px;border-radius:6px;background:var(--wash);margin-block:18px}

/* thread view */
.tview{max-width:760px;margin-inline:auto;padding-block:40px 88px}
.back{font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--muted)}
.back:hover{color:var(--accent)}
.tview h1{font-size:clamp(32px,4.4vw,52px);line-height:1.06;letter-spacing:-.02em;margin-block:14px 22px}
.op{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;padding:20px;border:1px solid var(--line);border-radius:6px;background:var(--wash);align-items:start}
.op.plain{grid-template-columns:minmax(0,1fr)}
.op .ph{aspect-ratio:1;border-radius:4px}
.op q{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.3;font-weight:500;color:var(--ink);quotes:"“" "”"}
.tag{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.posts{margin-top:18px}
.post{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding-block:20px;border-bottom:1px solid var(--line)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--sans);font-weight:800;font-size:15px;color:var(--ink)}
.who{font-family:var(--sans);font-weight:700;font-size:14.5px;color:var(--ink)}
.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0;color:var(--ink2);font-size:18px;line-height:1.6}
.linkbtn{background:none;border:0;color:var(--muted);font-family:var(--sans);font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline}
.linkbtn.warn{color:#B3261E}
form.compose{display:grid;gap:10px;margin-top:28px;padding:24px;border:1px solid var(--line);border-radius:6px}
.compose label{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.compose input,.compose select,.compose textarea{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:12px 14px;font-family:var(--serif);font-size:17px}
.compose input:focus,.compose textarea:focus,.compose select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(31,69,181,.12)}
.compose textarea{min-height:140px;resize:vertical}
.compose .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:4px}

/* footer */
footer{background:var(--wash);padding-block:56px 40px;margin-top:0}
.fgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:40px}
.fgrid p{margin:12px 0 0;color:var(--ink2);max-width:36ch;font-size:16px}
.fgrid h4{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.fgrid ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-family:var(--sans);font-size:14px}
.fgrid a:hover{color:var(--accent)}
.fbase{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--sans);font-size:12.5px;color:var(--muted)}

@media (max-width:1020px){
  .figrow{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:28px}
  .figrow a:nth-child(3){border-right:0;margin-right:0}
  .abody{grid-template-columns:minmax(0,1fr)}
  .prose,.debate,.sources{grid-column:1;max-width:680px;width:100%;margin-inline:auto}
  .aside{grid-column:1;position:static;max-width:680px;width:100%;margin-inline:auto;grid-row:1}
  .forum{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .cover,.lab,.lead-row,.fband{grid-template-columns:minmax(0,1fr)}
  .cover .txt{order:2}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .fgrid>div:first-child{grid-column:1/-1}
  .nav{gap:18px}
  .fband .ph{min-height:320px}
}
@media (max-width:560px){
  body{font-size:17px}
  .brand b{font-size:16px}
  .top .wrap{gap:12px}
  .nav a[data-nav="home"]{display:none}
  .grid3{grid-template-columns:minmax(0,1fr)}
  .figrow{grid-template-columns:repeat(2,minmax(0,1fr))}

/* ---------- helpers ---------- */
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const $ = s => document.querySelector(s);
const secName = id => L(SECTIONS.find(s => s.id === id)) || id;
const catName = id => L(CATS.find(c => c.id === id)) || L(CATS[CATS.length-1]);
function fmtDate(d){ try { return new Date(d+"T12:00:00").toLocaleDateString(lang==="es"?"es-ES":"en-GB",{day:"numeric",month:"long",year:"numeric"}); } catch(e){ return d; } }
function ago(ms){
  if (!ms) return "";
  const rtf = new Intl.RelativeTimeFormat(lang, {numeric:"auto"});
  const s = (ms - Date.now())/1000, a = Math.abs(s);
  if (a < 60) return rtf.format(Math.round(s), "second");
  if (a < 3600) return rtf.format(Math.round(s/60), "minute");
  if (a < 86400) return rtf.format(Math.round(s/3600), "hour");
  if (a < 2592000) return rtf.format(Math.round(s/86400), "day");
  return new Date(ms).toLocaleDateString(lang==="es"?"es-ES":"en-GB");
}
function hue(str){ let h=0; for (const c of String(str)) h = (h*31 + c.charCodeAt(0)) % 360; return h; }
function newId(){ return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8); }
function rows(snap){
  if (!snap) return [];
  const list = Array.isArray(snap) ? snap : (snap.docs || snap.items || snap.documents || []);
  return Array.from(list).map(d => {
    let data = typeof d.data === "function" ? d.data() : (d.data !== undefined ? d.data : d);
    data = data || {};
    return Object.assign({}, data, { id: d.id || (d.ref && d.ref.id) || data.id });
  }).filter(r => r.id);
}
const repliesFor = tid => S.replies.filter(r => r.threadId === tid).sort((a,b) => (a.createdAt||0)-(b.createdAt||0));
const nReplies = slug => repliesFor("art-"+slug).length;
const repLabel = n => `${n} ${n===1?t("reply"):t("replies")}`;
function lastSnippet(tid){ const r = repliesFor(tid); return r.length ? r[r.length-1].body : ""; }
function lastAt(tid){ const r = repliesFor(tid); return r.length ? r[r.length-1].createdAt : 0; }

function allThreads(){
  const counts = {};
  for (const r of S.replies) counts[r.threadId] = (counts[r.threadId]||0) + 1;
  const list = [];
  for (const a of ARTICLES) {
    const id = "art-" + a.slug;
    if (counts[id]) list.push({ kind:"article", id, slug:a.slug, title:L(a).title, n:counts[id], last:lastAt(id), snippet:lastSnippet(id) });
  }
  for (const th of S.threads) list.push({ kind:"free", id:th.id, title:th.title, cat:th.category, n:counts[th.id]||0, last:Math.max(th.createdAt||0, lastAt(th.id)), snippet:lastSnippet(th.id) || th.body });
  return list.sort((a,b) => b.last - a.last);
}

/* ---------- db ---------- */
async function connect(){
  const timeout = new Promise(r => setTimeout(() => r([null,null]), 12000));
  let db = null, user = null;
  try {
    if (window.claude && typeof window.claude.use === "function")
      [db, user] = await Promise.race([Promise.all([window.claude.use("db"), window.claude.use("user")]), timeout]);
  } catch(e){ db = null; }
  if (!db) { S.status = "offline"; render(true); return; }
  S.db = db; S.user = user;
  try { S.me = user && typeof user.id === "function" ? await user.id() : null; } catch(e){ S.me = null; }
  try { if (user && typeof user.can === "function") S.canWrite = await user.can("data.write"); } catch(e){}
  S.status = "live";
  subscribe("threads", list => { S.threads = list; render(true); });
  subscribe("replies", list => { S.replies = list; render(true); });
  render(true);
}
function subscribe(path, cb){
  const col = S.db.collection(path);
  if (typeof col.onSnapshot === "function") { try { col.onSnapshot(snap => cb(rows(snap)), () => {}); return; } catch(e){} }
  const poll = async () => { try { cb(rows(await col.get())); } catch(e){} };
  poll(); setInterval(poll, 15000);
}
async function resolveNames(){
  const ids = [...new Set([...document.querySelectorAll("[data-uid]")].map(e => e.dataset.uid))].filter(id => id && id !== "editorial");
  const missing = ids.filter(id => !(id in S.names));
  if (missing.length && S.user && typeof S.user.profiles === "function") {
    try {
      const ps = await S.user.profiles(missing);
      for (const id of missing) { const p = ps && (typeof ps.get === "function" ? ps.get(id) : ps[id]); S.names[id] = (p && p.name) || ""; }
    } catch(e){}
  }
  document.querySelectorAll("[data-uid]").forEach(el => {
    const id = el.dataset.uid;
    let n = id === "editorial" ? t("editorial") : (S.names[id] || t("someone"));
    if (id && id === S.me) n += " (" + t("you") + ")";
    el.textContent = el.classList.contains("av") ? (n.trim()[0] || "?").toUpperCase() : n;
  });
}

/* ---------- trajectory lab ---------- */
const NET_X = 11.885, NET_H = 0.914, BASE = 23.77, TARGET = 21.5;
function sim(v0, deg, rpm){
  const m=0.057, r=0.0335, A=Math.PI*r*r, rho=1.21, Cd=0.55, g=9.81, dt=0.002;
  let x=0, y=1.0, a=deg*Math.PI/180, vx=v0*Math.cos(a), vy=v0*Math.sin(a), tt=0, netY=null;
  const w = rpm*2*Math.PI/60, pts=[[0,1]];
  for (let i=0;i<6000;i++){
    const v=Math.hypot(vx,vy), k=0.5*rho*A*v*v/m, CL = w>0 ? 1/(2+v/(r*w)) : 0;
    const ax = -k*Cd*vx/v + k*CL*(vy/v), ay = -k*Cd*vy/v - g + k*CL*(-vx/v);
    const px=x, py=y; vx+=ax*dt; vy+=ay*dt; x+=vx*dt; y+=vy*dt; tt+=dt;
    if (px<NET_X && x>=NET_X) netY = py+(y-py)*(NET_X-px)/(x-px);
    if (i%8===0) pts.push([x,y]);
    if (y<=0){ pts.push([x,0]); break; }
  }
  return {x, netY, t:tt, pts};
}
function solve(v0, rpm){
  let lo=-10, hi=30;
  for (let i=0;i<40;i++){ const mid=(lo+hi)/2; if (sim(v0,mid,rpm).x < TARGET) lo=mid; else hi=mid; }
  return {angle:lo, ...sim(v0,lo,rpm)};
}
const W=680, H=280, X0=16, X1=664, Y0=236;
const sx = x => X0 + (x+0.3)/(BASE+0.6)*(X1-X0);
const sy = y => Y0 - y*66;
const path = pts => pts.map((p,i)=>(i?"L":"M")+sx(p[0]).toFixed(1)+" "+sy(Math.max(0,p[1])).toFixed(1)).join(" ");
const ghosts = {};
function labSVG(){
  const g0 = ghosts[0] || (ghosts[0]=solve(30,0)), g3 = ghosts[3000] || (ghosts[3000]=solve(30,3000));
  const tick = m => `<line x1="${X0}" x2="${X1}" y1="${sy(m)}" y2="${sy(m)}" stroke="#E3E6EB" stroke-width="1"/><text x="${X0}" y="${sy(m)-5}" font-family="IBM Plex Mono, monospace" font-size="10" fill="#69717E">${m} m</text>`;
  const lbl = (x,y,s,anchor="middle") => `<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="Archivo, sans-serif" font-size="10.5" font-weight="600" fill="#69717E">${s}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("labT"))}">
    <rect x="${sx(0)}" y="${Y0}" width="${sx(BASE)-sx(0)}" height="6" fill="#1F45B5" opacity=".12"/>
    ${[1,2,3].map(tick).join("")}
    <line x1="${X0}" x2="${X1}" y1="${Y0}" y2="${Y0}" stroke="#101317" stroke-width="1.5"/>
    <line x1="${sx(0)}" x2="${sx(0)}" y1="${Y0-5}" y2="${Y0+6}" stroke="#101317" stroke-width="2"/>
    <line x1="${sx(BASE)}" x2="${sx(BASE)}" y1="${Y0-5}" y2="${Y0+6}" stroke="#101317" stroke-width="2"/>
    <line x1="${sx(NET_X+6.4)}" x2="${sx(NET_X+6.4)}" y1="${Y0-3}" y2="${Y0+6}" stroke="#69717E" stroke-width="1.2"/>
    <rect x="${sx(NET_X)-1.5}" y="${sy(NET_H)}" width="3" height="${Y0-sy(NET_H)}" fill="#101317"/>
    <line x1="${sx(NET_X)-10}" x2="${sx(NET_X)+10}" y1="${sy(NET_H)}" y2="${sy(NET_H)}" stroke="#101317" stroke-width="2"/>
    <path d="${path(g0.pts)}" fill="none" stroke="#9AA1AC" stroke-width="1.4" stroke-dasharray="5 5"/>
    <path d="${path(g3.pts)}" fill="none" stroke="#9AA1AC" stroke-width="1.6" stroke-dasharray="1 5" stroke-linecap="round"/>
    ${lbl(sx(NET_X)+16, sy(g0.netY)+14, "0 rpm","start")}
    ${lbl(sx(NET_X)+16, sy(g3.netY)-8, "3000 rpm","start")}
    <path id="live" d="" fill="none" stroke="#1F45B5" stroke-width="3.2" stroke-linecap="round"/>
    <circle id="liveball" r="7" fill="#D7EA3C" stroke="#101317" stroke-width="1.2" cx="${sx(TARGET)}" cy="${Y0-7}"/>
    ${lbl(sx(0), Y0+22, "0 m")}
    ${lbl(sx(NET_X), Y0+22, (lang==="es"?"Red · ":"Net · ")+"11,89 m".replace(",", lang==="es"?",":"."))}
    ${lbl(sx(BASE), Y0+22, "23,77 m".replace(",", lang==="es"?",":"."), "end")}
  </svg>`;
}
function updateLab(){
  const rpmEl = $("#rpm"), vEl = $("#vel"); if (!rpmEl) return;
  const rpm = +rpmEl.value, v = +vEl.value, s = solve(v, rpm);
  const dec = n => lang==="es" ? String(n).replace(".", ",") : String(n);
  $("#live").setAttribute("d", path(s.pts));
  $("#rpmv").textContent = rpm + " rpm";
  $("#velv").textContent = Math.round(v*3.6) + " km/h";
  $("#ro-angle").textContent = dec(s.angle.toFixed(1)) + "°";
  $("#ro-clear").textContent = s.netY == null ? "—" : Math.round((s.netY-NET_H)*100) + " cm";
  $("#ro-time").textContent = dec(s.t.toFixed(2)) + " s";
}

    <h1>${esc(c.title)}</h1>
    <div class="op">
      <a href="#a-${a.slug}">${photo(a.slug, c.title)}</a>
      <div style="display:grid;gap:10px;min-width:0">
        <span class="kicker">${t("debateQ")}</span>
        <q>${esc(c.question)}</q>
        <a class="back" href="#a-${a.slug}">${t("readArticle")}</a>
      </div>
    </div>
    <div class="posts">${S.status==="live" ? (list.length ? list.map(postHtml).join("") : `<p class="note" style="padding-block:20px">${t("noReplies")}</p>`) : ""}</div>
    ${composeReply(tid)}
  </section></div>`;
}
function viewThread(id){
  const th = S.threads.find(x => x.id === id);
  if (!th) return `<div class="wrap"><section class="tview"><a class="back" href="#foro">${t("backForum")}</a>${statusBox() || `<p class="note" style="margin-top:20px">${t("connecting")}</p>`}</section></div>`;
  const list = repliesFor(id), mine = th.authorId && th.authorId === S.me;
  return `<div class="wrap"><section class="tview">
    <a class="back" href="#foro">${t("backForum")}</a>
    <div style="margin-top:22px"><span class="tag">${esc(catName(th.category))}</span></div>
    <h1>${esc(th.title)}</h1>
    <div class="op plain">
      <div class="meta" style="align-items:center"><span class="who" data-uid="${esc(th.authorId)}"></span><span>${esc(ago(th.createdAt))}</span>
      ${mine && !list.length ? `<button type="button" class="linkbtn" data-del="${esc(th.id)}" data-col="threads">${t("del")}</button>` : ""}</div>
      <p class="body" style="margin:0">${esc(th.body)}</p>
    </div>
    <div class="posts">${list.length ? list.map(postHtml).join("") : `<p class="note" style="padding-block:20px">${t("noReplies")}</p>`}</div>
    ${composeReply(id)}
  </section></div>`;
}
function viewNew(){
  const body = (S.status !== "live" || S.canWrite === false) ? statusBox() : `
    <form class="compose" id="topicform">
      <label for="ttitle">${t("title")}</label>
      <input id="ttitle" maxlength="140" placeholder="${esc(t("titlePh"))}">
      <label for="tcat">${t("category")}</label>
      <select id="tcat">${CATS.map(c => `<option value="${c.id}">${esc(L(c))}</option>`).join("")}</select>
      <label for="tbody">${t("message")}</label>
      <textarea id="tbody" maxlength="4000" placeholder="${esc(t("bodyPh"))}"></textarea>
      <div class="row"><button class="btn blue" type="submit" id="topicsubmit">${t("create")}</button><span class="note" id="topicnote" role="status"></span></div>
    </form>`;
  return `<div class="wrap"><section class="tview"><a class="back" href="#foro">${t("backForum")}</a><h1>${t("newTopic")}</h1>${body}</section></div>`;
}

/* ---------- router & render ---------- */
function route(){
  const h = (location.hash || "#inicio").slice(1);
  if (h === "foro") return {v:"forum"};
  if (h === "nuevo") return {v:"new"};
  if (h.startsWith("a-") && bySlug[h.slice(2)]) return {v:"article", a:bySlug[h.slice(2)]};
  if (h.startsWith("d-") && bySlug[h.slice(2)]) return {v:"adebate", a:bySlug[h.slice(2)]};
  if (h.startsWith("t-")) return {v:"thread", id:h.slice(2)};
  if (h.startsWith("s-") && SECTIONS.some(s => s.id === h.slice(2))) return {v:"section", s:h.slice(2)};
  return {v:"home"};
}
function chrome(r){
  const forumish = ["forum","new","adebate","thread"].includes(r.v);
  document.documentElement.lang = lang;
  $("#nav-home").textContent = t("home");
  $("#nav-forum").innerHTML = esc(t("forum")) + (S.status==="live" && forumCount() ? `<span class="badge">${forumCount()}</span>` : "");
  if (forumish) { $("#nav-forum").setAttribute("aria-current","page"); $("#nav-home").removeAttribute("aria-current"); }
  else { $("#nav-home").setAttribute("aria-current","page"); $("#nav-forum").removeAttribute("aria-current"); }
  ["es","en"].forEach(l => $("#lang-"+l).setAttribute("aria-pressed", String(l===lang)));
  const cur = r.s || (r.a && r.v==="article" ? r.a.section : "");
  $("#sections").innerHTML = `<a href="#inicio" ${r.v==="home"?'aria-current="page"':""}>${t("allSections")}</a>` +
    SECTIONS.map(s => `<a href="#s-${s.id}" ${cur===s.id?'aria-current="page"':""}>${esc(L(s))}</a>`).join("");
  $("#foot-about").textContent = t("about");
  $("#foot-sec").textContent = t("footSec"); $("#foot-comm").textContent = t("footComm");
  $("#foot-sections").innerHTML = SECTIONS.map(s => `<li><a href="#s-${s.id}">${esc(L(s))}</a></li>`).join("");
  $("#foot-links").innerHTML = `<li><a href="#foro">${t("forum")}</a></li><li><a href="#nuevo">${t("newTopic")}</a></li><li><a href="#d-magnus">${t("enterDebate")}</a></li>`;
  $("#foot-l").textContent = t("footL"); $("#foot-r").textContent = t("footR");
  document.title = r.a ? L(r.a).title + " · ShotDepth Journal" : (forumish ? t("forum") + " · ShotDepth Journal" : "ShotDepth Journal");
}
let lastKey = "";
function render(fromData){
  const r = route();
  const key = r.v + (r.a ? r.a.slug : "") + (r.id||"") + (r.s||"") + lang;
  chrome(r);
  // live data on reading pages: patch small regions instead of redrawing the page
  if (fromData && key === lastKey && (r.v === "home" || r.v === "section" || r.v === "article")) {
    const fl = $("#fband-list"); if (fl) fl.innerHTML = forumBandList();
    resolveNames(); return;
  }
  const draft = {};
  ["replybody","ttitle","tbody","tcat"].forEach(id => { const el = document.getElementById(id); if (el) draft[id] = el.value; });
  const ae = document.activeElement, focusId = fromData && ae && ae.id && draft[ae.id] !== undefined ? ae.id : null;
  const selS = focusId ? ae.selectionStart : 0, selE = focusId ? ae.selectionEnd : 0, keepY = window.scrollY;
  let html;
  if (r.v === "forum") html = viewForum();
  else if (r.v === "new") html = viewNew();
  else if (r.v === "article") html = viewArticle(r.a);
  else if (r.v === "adebate") html = viewArticleThread(r.a);
  else if (r.v === "thread") html = viewThread(r.id);
  else if (r.v === "section") html = viewSection(r.s);
  else html = viewHome();
  $("#app").innerHTML = html;
  if (fromData && key === lastKey) for (const id in draft) { const el = document.getElementById(id); if (el) el.value = draft[id]; }
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus({preventScroll:true}); try { el.setSelectionRange(selS, selE); } catch(_){} } }
  if (fromData && key === lastKey) window.scrollTo(0, keepY); else if (!fromData) window.scrollTo(0, 0);
  lastKey = key;
  if ($("#rpm")) updateLab();
  resolveNames();
}

/* ---------- events ---------- */
window.addEventListener("hashchange", () => render());
document.addEventListener("input", e => { if (e.target.id === "rpm" || e.target.id === "vel") updateLab(); });
document.addEventListener("click", async e => {
  const lb = e.target.closest("[data-lang]");
  if (lb) { lang = lb.dataset.lang; try { localStorage.setItem("sd-lang", lang); } catch(_){} const y = window.scrollY; render(true); window.scrollTo(0, y); return; }
  const tb = e.target.closest("[data-tab]");
  if (tb) { S.forumTab = tb.dataset.tab; lastKey = ""; const y = window.scrollY; render(true); window.scrollTo(0, y); return; }
  const db = e.target.closest("[data-del]");
  if (db) {
    if (db.dataset.armed !== "1") { db.dataset.armed = "1"; db.textContent = t("sure"); db.classList.add("warn"); return; }
    try { await S.db.doc(db.dataset.col + "/" + db.dataset.del).delete(); if (db.dataset.col === "threads") location.hash = "#foro"; }
    catch(_){ db.textContent = t("errWrite"); }
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  if (!S.db) return;
  if (e.target.id === "replyform") {
    const tid = e.target.dataset.tid, ta = $("#replybody"), note = $("#replynote"), btn = $("#replysubmit");
    const body = ta.value.trim();
    if (!body) { note.textContent = t("errEmpty"); note.className = "note err"; return; }
    btn.disabled = true; note.className = "note"; note.textContent = t("posting");
    try {
      await S.db.doc("replies/" + newId()).set({ threadId: tid, body: body.slice(0,4000), authorId: S.me || "", createdAt: Date.now() });
      const ta2 = $("#replybody"); if (ta2) ta2.value = ""; const n2 = $("#replynote"); if (n2) n2.textContent = "";
    } catch(_) { const n2 = $("#replynote"); if (n2) { n2.textContent = t("errWrite"); n2.className = "note err"; } }
    const b2 = $("#replysubmit"); if (b2) b2.disabled = false;
  }
  if (e.target.id === "topicform") {
    const title = $("#ttitle").value.trim(), body = $("#tbody").value.trim(), cat = $("#tcat").value;
    const note = $("#topicnote"), btn = $("#topicsubmit");
    if (!title) { note.textContent = t("errTitle"); note.className = "note err"; return; }
    if (!body) { note.textContent = t("errEmpty"); note.className = "note err"; return; }
    btn.disabled = true; note.className = "note"; note.textContent = t("posting");
    const id = newId();
    try {
      await S.db.doc("threads/" + id).set({ title: title.slice(0,140), body: body.slice(0,4000), category: cat, authorId: S.me || "", createdAt: Date.now() });
      location.hash = "#t-" + id;
    } catch(_) { note.textContent = t("errWrite"); note.className = "note err"; btn.disabled = false; }
  }
});

render();
connect();
})();

</script>

</body></html>
